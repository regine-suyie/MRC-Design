<!doctype html>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
      :root {
        --ink: #111418;
        --ink-soft: #6b7280;
        --line: #e5e7eb;
        --chip-bg: #f3f4f6;
        --red: #f0403d;
        --red-dark: #d92e2b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        background: #ffffff;
        color: var(--ink);
        line-height: 1.5;
      }

      #hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem 1.5rem;
      }

      /* Hanging crane rig */
      .rig {
        position: relative;
        width: 100%;
        max-width: 220px;
        height: 190px;
        margin-bottom: 1.25rem;
        touch-action: none;
      }

      .pivot {
        position: absolute;
        top: 0;
        left: 50%;
        width: 6px;
        height: 6px;
        background: var(--ink);
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }

      .rope-line {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }

      .crane-bob {
        position: absolute;
        top: 0;
        left: 0;
        width: 96px;
        height: 96px;
        margin-left: -48px;
        margin-top: -48px;
        cursor: grab;
      }

      .crane-bob:active {
        cursor: grabbing;
      }

      .crane-bob svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 10px 12px rgba(15, 23, 42, 0.15));
      }

      .drag-tag {
        position: absolute;
        top: 8px;
        left: 62%;
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.3rem 0.8rem;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--ink);
        box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
        animation: tagBounce 2.4s ease-in-out infinite;
        pointer-events: none;
        white-space: nowrap;
      }

      .drag-tag.hidden {
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      @keyframes tagBounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }

      h1 {
        font-size: clamp(1.9rem, 5.2vw, 3.1rem);
        font-weight: 900;
        letter-spacing: -0.03em;
        line-height: 1.08;
        max-width: 720px;
        margin-bottom: 0.85rem;
      }

      .eyebrow {
        font-size: clamp(1.15rem, 2.4vw, 1.5rem);
        font-weight: 800;
        letter-spacing: -0.01em;
        color: var(--ink);
        margin-bottom: 0.3rem;
      }

      .eyebrow-sub {
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-soft);
        opacity: 0.7;
        margin-bottom: 2.25rem;
      }

      .contact-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 1rem;
      }

      .phone-chip {
        background: var(--chip-bg);
        color: var(--ink-soft);
        font-weight: 600;
        font-size: 0.95rem;
        padding: 0.85rem 1.4rem;
        border-radius: 999px;
      }

      .cta-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        background: var(--red);
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.95rem;
        padding: 0.85rem 1.6rem;
        border-radius: 999px;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      .cta-btn svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }

      .cta-btn:hover {
        background: var(--red-dark);
        transform: translateY(-1px);
      }

      .office-line {
        font-size: 0.85rem;
        color: var(--ink-soft);
      }

      .office-line a {
        color: var(--ink-soft);
        font-weight: 600;
        text-decoration: none;
        border-bottom: 1px solid var(--line);
      }

      .office-line a:hover {
        color: var(--ink);
        border-color: var(--ink-soft);
      }

      footer {
        text-align: center;
        padding: 1.5rem;
        font-size: 0.75rem;
        color: var(--ink-soft);
      }
    </style>
  </head>
  <body>

      </section>
    </main>

    <footer>

    <script>
      const rig = document.getElementById("rig");
      const bob = document.getElementById("crane-bob");
      const rope = document.getElementById("rope");
      const dragTag = document.getElementById("drag-tag");

      let pivotX = 0,
        pivotY = 0;
      let restX = 0,
        restY = 0;
      let x = 0,
        y = 0,
        vx = 0,
        vy = 0;
      let dragging = false;
      let dragOffsetX = 0,
        dragOffsetY = 0;
      let hasDragged = false;
      let animId = null;

      function layout() {
        const rect = rig.getBoundingClientRect();
        pivotX = rect.width / 2;
        pivotY = 0;
        restX = pivotX;
        restY = 130;
        if (!dragging && !animId) {
          x = restX;
          y = restY;
          render();
        }
      }

      function render() {
        bob.style.transform = `translate(${x}px, ${y}px)`;
        rope.setAttribute("x1", pivotX);
        rope.setAttribute("y1", pivotY);
        rope.setAttribute("x2", x);
        rope.setAttribute("y2", y);
      }

      function pointerPos(e) {
        const rect = rig.getBoundingClientRect();
        return { px: e.clientX - rect.left, py: e.clientY - rect.top };
      }

      bob.addEventListener("pointerdown", (e) => {
        dragging = true;
        hasDragged = true;
        dragTag.classList.add("hidden");
        cancelAnimationFrame(animId);
        animId = null;
        bob.setPointerCapture(e.pointerId);
        const { px, py } = pointerPos(e);
        dragOffsetX = x - px;
        dragOffsetY = y - py;
      });

      bob.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const { px, py } = pointerPos(e);
        const nx = px + dragOffsetX;
        const ny = py + dragOffsetY;
        const dx = nx - pivotX;
        const dy = ny - pivotY;
        const dist = Math.hypot(dx, dy);
        const maxDist = 190;
        if (dist > maxDist) {
          x = pivotX + (dx / dist) * maxDist;
          y = pivotY + (dy / dist) * maxDist;
        } else {
          x = nx;
          y = ny;
        }
        render();
      });

      function release() {
        if (!dragging) return;
        dragging = false;
        vx = 0;
        vy = 0;
        settle();
      }

      bob.addEventListener("pointerup", release);
      bob.addEventListener("pointercancel", release);

      function settle() {
        const k = 0.09;
        const damping = 0.82;

        function step() {
          const ax = -k * (x - restX);
          const ay = -k * (y - restY);
          vx = (vx + ax) * damping;
          vy = (vy + ay) * damping;
          x += vx;
          y += vy;
          render();

          if (
            Math.abs(vx) > 0.05 ||
            Math.abs(vy) > 0.05 ||
            Math.abs(x - restX) > 0.3 ||
            Math.abs(y - restY) > 0.3
          ) {
            animId = requestAnimationFrame(step);
          } else {
            x = restX;
            y = restY;
            render();
            animId = null;
          }
        }
        animId = requestAnimationFrame(step);
      }

      window.addEventListener("resize", layout);
      layout();
    </script>
